version: "3.9"

# ============================================================
# Customer Success Automation Hub - Run from GHCR
# ------------------------------------------------------------
# 拉取 GitHub Container Registry 上預先建好的 image 並啟動。
# 不需要本機 build，適合給面試官或客戶快速 demo。
#
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#
# 想要切換到自己的 backend (例如部到 Azure 上)，把 VITE_API_BASE_URL
# 換成對應 URL 即可，無需重新 build web image。
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: csah-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: csah
      POSTGRES_PASSWORD: csah
      POSTGRES_DB: csah
    ports:
      - "5432:5432"
    volumes:
      - csah_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csah -d csah"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/xu323/customer-success-automation-hub/api:latest
    container_name: csah-api
    restart: unless-stopped
    environment:
      APP_ENV: docker
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATABASE_URL: postgresql+psycopg://csah:csah@db:5432/csah
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SEED_ON_STARTUP: "true"
      AI_PROVIDER: mock
      DYNAMICS_CRM_MODE: mock
      BUSINESS_CENTRAL_MODE: mock
      POWER_AUTOMATE_MODE: mock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/xu323/customer-success-automation-hub/web:latest
    container_name: csah-web
    restart: unless-stopped
    environment:
      # Runtime injected into the static bundle by docker-entrypoint.sh
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  csah_db_data:
