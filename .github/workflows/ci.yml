name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SEED_ON_STARTUP: "false"
          AI_PROVIDER: mock
          DYNAMICS_CRM_MODE: mock
          BUSINESS_CENTRAL_MODE: mock
          POWER_AUTOMATE_MODE: mock
        run: pytest -q

  frontend-ci:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build

  docker-build:
    name: Docker images build check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t csah-api:ci ./apps/api

      - name: Build Web image
        run: docker build -t csah-web:ci ./apps/web

  docs-check:
    name: Docs presence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required docs exist
        shell: bash
        run: |
          set -e
          required=(
            "README.md"
            "使用方法.md"
            "docs/architecture.md"
            "docs/research-notes.md"
            "docs/security-notes.md"
            "docs/api.md"
            "docs/workflow-engine.md"
            "docs/project-guide.md"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required document is missing"
              missing=1
            else
              echo "ok: $f"
            fi
          done
          exit $missing
